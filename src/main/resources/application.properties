
server.port=8080

# ==== Database ====
spring.datasource.url=jdbc:mysql://localhost:3306/microfinance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== JPA / Hibernate ====
# update = Hibernate auto-creates/updates tables from @Entity classes on startup
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==== JWT ====
jwt.secret=microfinance-super-secret-jwt-key-min-256-bits-long-1234567890
jwt.expiration-ms=86400000

# ==== Logging ====
logging.level.org.springframework.security=DEBUG

# ==== Swagger / OpenAPI ====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
